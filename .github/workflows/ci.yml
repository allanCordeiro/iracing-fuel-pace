name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
      # Enable once tools/FuelPace.Replay exists (Task 16):
      # - if: matrix.os == 'windows-latest'
      #   run: dotnet publish tools/FuelPace.Replay -c Release -r win-x64 --self-contained false
