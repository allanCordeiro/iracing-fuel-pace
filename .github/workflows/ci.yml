name: ci
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test FuelPace.Linux.slnf -c Release
      # The benchmark project must keep compiling; it is never run in CI.
      - run: dotnet build bench/FuelPace.Bench -c Release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compute version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          $base = '0.1.0'
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $base = $Matches[1] }
          $v = "$base+$($env:RUN_NUMBER).$($env:SHA.Substring(0,7))"
          "FP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test (full solution)
        run: dotnet test FuelPace.sln -c Release "-p:InformationalVersion=$env:FP_VERSION"
      - name: Package
        shell: pwsh
        run: pwsh build/package.ps1 -Version $env:FP_VERSION -OutDir out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuelpace-windows
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/*.zip
            tests/**/TestResults/**
            artifacts/**

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fuelpace-windows
          path: dl
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          zips=(dl/out/*.zip)
          [ ${#zips[@]} -eq 2 ] || { echo "expected 2 zips, found ${#zips[@]}"; exit 1; }
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${zips[@]}" --clobber --repo "$REPO"
          else
            gh release create "$TAG" "${zips[@]}" --generate-notes --repo "$REPO"
          fi
